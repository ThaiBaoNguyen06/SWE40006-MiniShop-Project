<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MiniShop Production Monitoring</title>
<style>body{font:16px system-ui;background:#101827;color:#e9eff9;margin:40px}h1{font-size:28px}table{border-collapse:collapse;width:100%;background:#182439}td,th{padding:16px;text-align:left;border-bottom:1px solid #33445f}canvas{width:100%;max-width:900px;background:#182439}#status{font-size:20px;color:#89d6f5}</style>
<h1>MiniShop · Production monitoring</h1><p id="status">Collecting metrics…</p><p id="time"></p><h2>HTTP database-health latency (ms)</h2><canvas id="chart" width="900" height="180"></canvas><h2>Live production container metrics</h2><table><thead><tr><th>Container</th><th>CPU</th><th>RAM usage / limit</th><th>RAM %</th><th>Network I/O</th><th>Block I/O</th></tr></thead><tbody id="rows"></tbody></table>
<script>
async function refresh(){try{const r=await fetch('/metrics.json');const {latest,history}=await r.json();document.getElementById('status').textContent='Health: '+latest.status+' · HTTP '+latest.statusCode+' · '+latest.latencyMs+' ms';document.getElementById('time').textContent='Last sample: '+latest.at+(latest.error?' · '+latest.error:'');const rows=document.getElementById('rows');rows.replaceChildren();for(const item of latest.containers){const tr=document.createElement('tr');for(const key of ['Name','CPUPerc','MemUsage','MemPerc','NetIO','BlockIO']){const td=document.createElement('td');td.textContent=item[key];tr.append(td)}rows.append(tr)}const ctx=document.getElementById('chart').getContext('2d');ctx.clearRect(0,0,900,180);const max=Math.max(1,...history.map(x=>x.latencyMs));ctx.strokeStyle='#67d9ff';ctx.lineWidth=2;ctx.beginPath();history.forEach((x,i)=>{const px=20+i*860/59,py=160-x.latencyMs/max*130;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.fillStyle='#e9eff9';ctx.fillText('Scale: 0–'+max.toFixed(1)+' ms | last '+history.length+' samples',20,15)}catch(e){document.getElementById('status').textContent='Monitoring unavailable: '+e.message}}
refresh();setInterval(refresh,5000);
</script></html>
