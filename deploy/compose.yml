services:
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: minishop
      POSTGRES_DB: minishop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U minishop -d minishop]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    image: minishop-backend:${RELEASE:?required}
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      APP_ENV: ${APP_ENV}
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-false}
      AUTOMATION_MODE: ${AUTOMATION_MODE:-local}
      AUTOMATION_DIR: /automation
      ADMIN_TOKEN_FILE: /run/secrets/minishop_admin
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      GITHUB_BASE_BRANCH: ${GITHUB_BASE_BRANCH:-main}
      GITHUB_AUTOMATION_TOKEN: ${GITHUB_AUTOMATION_TOKEN:-}
      ALLOW_PRODUCTION_PROPOSALS: ${ALLOW_PRODUCTION_PROPOSALS:-false}
      GITHUB_DELIVERY_MODE: ${GITHUB_DELIVERY_MODE:-review}
      GITHUB_TOKEN_FILE_ENABLED: ${GITHUB_TOKEN_FILE_ENABLED:-false}
      STAGING_URL: ${STAGING_URL:-http://localhost:8283}
      PRODUCTION_URL: ${PRODUCTION_URL:-http://localhost:8284}
      APP_RELEASE: ${RELEASE}
      DATABASE_URL: postgres://minishop:${POSTGRES_PASSWORD}@database:5432/minishop
    volumes:
      - ${AUTOMATION_HOST_DIR}/queue:/automation
      - ${AUTOMATION_HOST_DIR}/admin-token:/run/secrets/minishop_admin:ro
      - ${AUTOMATION_HOST_DIR}/github-token:/run/secrets/minishop_github:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/db-health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    image: minishop-frontend:${RELEASE:?required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:?required}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  data:
